<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Device preview</title>
<style>

.dev{text-align:center}
.frame{border:12px solid #000;border-radius:28px;overflow:hidden;background:#fff}

<div class="dev"><div>Android tablet (landscape 1024×640)</div><div class="frame"><iframe src="index.html" width="1024" height="640"></iframe></div></div>
</body></html>
